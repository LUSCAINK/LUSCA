name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste session tokens (`--auth`), keypairs, seed phrases or other secrets; redact them
        from logs and screenshots. Report security issues privately to lusca@collider.capital
        (see [SECURITY.md](https://github.com/LUSCAINK/LUSCA/blob/main/SECURITY.md)).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - lusca.ink
        - Local (`npm run dev` or `npm start`)
        - Desktop neuron
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Commit (`git rev-parse --short HEAD`) or neuron build (`node neuron.mjs --version`):
        - OS, and browser and version, or Node version (`node -v`):
        - GPU and tier (if a neuron is involved):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets before posting.
      render: text
